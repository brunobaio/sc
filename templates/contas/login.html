{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>Login</h2>

    {% if messages %}
        {% for message in messages %}
            <p style="color:green;">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    {% if erro %}
        <p style="color:red;">
            {{ erro }}
        </p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Usuário</label>
        <input type="text" name="username" required>

        <label>Senha</label>
        <input type="password" name="password" required>

        <button type="submit">
            Entrar
        </button>

    </form>

    <br>

    <div style="text-align:center;">

        <a href="{% url 'esqueci_senha' %}">
            Esqueci minha senha
        </a>

        <br><br>

        <a href="{% url 'cadastro' %}">
            Ainda não possui cadastro?
        </a>

    </div>

</div>

{% endblock %}
